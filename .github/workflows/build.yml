name: Build standalone executables

# Builds the Windows .exe and macOS .app with PyInstaller on native runners
# (no cross-compiling). Artifacts are attached to each run; pushing a v* tag
# also publishes them to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # lets you build on demand from the Actions tab

permissions:
  contents: write           # needed to create the Release on tag pushes

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ESP-Flasher-Companion-windows
          - os: macos-latest
            artifact: ESP-Flasher-Companion-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller esptool pyserial

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ESP-Flasher-Companion
          --icon src/WCB.ico
          --add-data "src/WCB.ico;."
          --add-data "src/WCB.png;."
          --distpath . --workpath build
          --collect-all esptool --collect-all serial
          src/esp_flasher_companion.py

      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        run: .\ESP-Flasher-Companion.exe --selftest

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name "ESP Flasher Companion"
          --icon src/WCB.icns
          --add-data "src/WCB.png:."
          --distpath . --workpath build
          --collect-all esptool --collect-all serial
          src/esp_flasher_companion.py

      - name: Self-test + zip .app (macOS)
        if: runner.os == 'macOS'
        run: |
          "ESP Flasher Companion.app/Contents/MacOS/ESP Flasher Companion" --selftest
          ditto -c -k --keepParent "ESP Flasher Companion.app" "ESP-Flasher-Companion-macos.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            ESP-Flasher-Companion.exe
            ESP-Flasher-Companion-macos.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
